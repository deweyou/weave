version: 3
strategy: branch
context:
  repository:
    source:
      entry: AGENTS.md
  knowledge:
    source:
      entry: docs/index.md
  product:
    source:
      entry: docs/product.md
  release-scope:
    source:
      entry: docs/specs/first-release.md
  architecture:
    source:
      entry: docs/architecture.md
  design:
    source:
      entry: DESIGN.md
  verification:
    source:
      entry: docs/verification.md
  development:
    source:
      entry: docs/development.md
skills:
  apple-design:
    source:
      entry: .agents/skills/apple-design
  visual-design:
    source:
      entry: .agents/skills/high-end-visual-design
nodes:
  scope-design:
    kind: agent
    description: 需求有产品取舍或新增能力时，结合当前实现收敛范围、交互场景与可观察验收；输出未决项。
    outputs:
      proposal:
        type: string
        description: 范围、方案、验收场景与待确认决策；复杂任务另发布 Spec Export。
  design-review:
    kind: agent
    skill: [apple-design, visual-design]
    description: 审核原生界面或文档样式；先读 DESIGN 的 Web skill 适配边界，再基于实际 App 提出改进。
    outputs:
      findings:
        type: string
        description: 场景、观察证据、预期、严重性和修复建议；区分视觉与输入行为。
  editor-implement:
    kind: agent
    skill: [apple-design]
    description: 实现已收敛的 Swift 编辑器或应用改动，保护组合输入、选区、撤销与持久化，维护相关知识。
    outputs:
      changes:
        type: string
        description: 改动及原因、受影响平台、测试建议与遗留问题。
  swift-tests:
    kind: command
    description: Swift 行为或数据修改时运行测试；覆盖范围以测试代码为准，不替代 UI 验收。
    command: swift test --enable-code-coverage
  coverage-check:
    kind: command
    description: 在当前工作区完成带覆盖率的单测后执行；核心逻辑、原生桥接与全源码分别设门槛，缺失报告直接失败。
    command: python3 scripts/check_coverage.py "$(swift test --show-codecov-path)"
  macos-ui-tests:
    kind: command
    description: 执行 macOS 原生 UI 自动化；使用 Debug 专用隔离数据，覆盖编辑、重启恢复、快捷语法和撤销。
    command: xcodebuild -project Weave.xcodeproj -scheme Weave -destination 'platform=macOS' -derivedDataPath .build/ui-macos -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
  ios-ui-tests:
    kind: command
    description: 在本机可用 iPhone 模拟器上执行新建、编辑、重启恢复和 Markdown 冒烟测试。
    command: xcodebuild -project Weave.xcodeproj -scheme Weave -destination "platform=iOS Simulator,id=$(python3 scripts/select_simulator.py)" -derivedDataPath .build/ui-ios -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
  macos-build:
    kind: command
    description: Mac 或共享源码变化时验证 macOS target 编译。
    command: xcodebuild -project Weave.xcodeproj -scheme Weave -destination 'platform=macOS' -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build
  ios-build:
    kind: command
    description: iOS 或共享源码变化时验证 iOS Simulator target 编译，不代表真机运行。
    command: xcodebuild -project Weave.xcodeproj -scheme Weave -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
  interaction-review:
    kind: agent
    skill: [apple-design]
    description: UI 或输入行为变化后在实际 App 执行受影响操作；依据验证清单记录证据和未测试平台。
    outputs:
      verification:
        type: string
        description: 平台与构建、操作步骤、观察、证据引用、通过及未通过场景。
  repository-update:
    kind: agent
    description: 行为、架构、设计或命令改变时维护当前知识；不将历史 Run 状态写进仓库。
  config-review:
    kind: agent
    description: Harness 配置维护时调用 config_inspect，核对资源入口、技能引用、命令与授权语义。
    outputs:
      validation:
        type: string
        description: 配置版本、资源和节点校验结果、当前工作区及仍存在的问题。
  repository-review:
    kind: agent
    description: 核查最终差异、文档链接和源码一致性、测试证据及范围；包括新增文件，不只检查已跟踪差异。
    outputs:
      review:
        type: string
        description: 实际检查范围、问题与依据、剩余风险和交付建议。
  commit-local:
    kind: agent
    description: 用户授权提交后核对完整差异并创建本地提交，报告 SHA 与工作区状态。
    authority: [commit]
  pull-request:
    kind: agent
    description: 用户要求 PR 后核对远端、权限和已有 PR，推送分支并优先通过 GitHub plugin 创建或更新 PR。
    authority: [push, create-or-update-pr]
    outputs:
      delivery:
        type: string
        description: 仓库、提交、源和目标分支、PR 链接与交付状态；不包含合并或发布。
